name: Firmware and protocol tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18 pyserial==3.5
      - run: tools/test-native.sh
      - run: python tests/serial_smoke_test.py
      - run: pio run -j 4
      - run: python tools/package-firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: tpdd2-r0.1-fnk0104b
          path: |
            build/tpdd2-r0.1-fnk0104b.bin
            build/tpdd2-r0.1-fnk0104b.bin.sha256
            docs/testing.md
